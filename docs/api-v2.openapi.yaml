openapi: 3.1.1
info:
  title: Ryo Explorer API v2
  version: 0.3.0
  description: |
    Opt-in read-only API using native Ryo
    LMDB snapshots. Decimal-string DTOs preserve integer precision; raw native
    JSON retains Ryo's number conventions. No private keys or propagation data.
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
servers:
  - url: /
security: []
paths:
  /api/v2/network:
    get:
      operationId: getNetwork
      summary: Read this native reader's chain state and configuration
      description: Does not report daemon synchronization or total network peers.
      responses:
        '200':
          description: Consistent local chain snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/ChainChanged' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v2/blocks:
    get:
      operationId: listBlocks
      summary: Read bounded newest-first block summaries
      description: |
        The first request anchors at the tip. New blocks above the anchor do not
        change pagination. A replaced/removed anchor returns 409; restart without
        a cursor. Unknown/duplicate/empty/encoded parameters are rejected.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - name: cursor
          in: query
          description: Opaque to clients; use the returned next_cursor unchanged.
          schema: { $ref: '#/components/schemas/Cursor' }
      responses:
        '200':
          description: At most 20 summaries from one native read snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockPageResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/ChainChanged' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v2/blocks/{id}:
    get:
      operationId: getBlock
      summary: Read a block by canonical height or hexadecimal hash
      parameters:
        - { $ref: '#/components/parameters/BlockId' }
      responses:
        '200':
          description: Block header and native transaction summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/ChainChanged' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v2/transactions/{hash}:
    get:
      operationId: getTransaction
      summary: Read a confirmed or known native-pool transaction
      parameters:
        - { $ref: '#/components/parameters/TransactionHash' }
      responses:
        '200':
          description: Native public metadata; hidden output amounts are null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/ChainChanged' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v2/raw/block/{id}:
    get:
      operationId: getRawBlock
      summary: Read native block JSON and native serialized hex
      parameters:
        - { $ref: '#/components/parameters/BlockId' }
      responses:
        '200':
          description: Native Ryo object; JSON numbers are not decimal-string DTOs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RawResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/ChainChanged' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v2/raw/transaction/{hash}:
    get:
      operationId: getRawTransaction
      summary: Read native transaction JSON and native serialized hex
      parameters:
        - { $ref: '#/components/parameters/TransactionHash' }
      responses:
        '200':
          description: Native Ryo object; JSON numbers are not decimal-string DTOs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RawResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/ChainChanged' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v2/openapi.json:
    get:
      operationId: getOpenApi
      summary: Read the contract bundled into this executable
      responses:
        '200':
          description: OpenAPI 3.1.1 document, without a data envelope
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths, components]
                properties:
                  openapi: { const: 3.1.1 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    BlockId:
      name: id
      in: path
      required: true
      description: Canonical uint64 decimal height or 64 hex characters; hashes accept either case.
      schema:
        type: string
        maxLength: 64
        pattern: '^(0|[1-9][0-9]{0,19}|[0-9a-fA-F]{64})$'
    TransactionHash:
      name: hash
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
  responses:
    InvalidRequest:
      description: Invalid target, identifier, parameters, headers or body; code invalid_request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Valid resource absent, API disabled or unsupported route; code not_found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MethodNotAllowed:
      description: Only GET is supported; code method_not_allowed
      headers:
        Allow:
          schema: { const: GET }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ChainChanged:
      description: Replaced/removed anchor or inconsistent native snapshot; code chain_changed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: Native database, resource, capacity or serialization failure; code unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    UInt64:
      type: string
      pattern: '^(0|[1-9][0-9]{0,19})$'
      maxLength: 20
      description: Canonical decimal uint64; application enforces the 18446744073709551615 maximum.
      examples: ['0', '9007199254740993', '18446744073709551615']
    NullableUInt64:
      anyOf:
        - { $ref: '#/components/schemas/UInt64' }
        - { type: 'null' }
    Hash:
      type: string
      pattern: '^[0-9a-f]{64}$'
    NullableHash:
      anyOf:
        - { $ref: '#/components/schemas/Hash' }
        - { type: 'null' }
    Hex:
      type: string
      pattern: '^([0-9a-f]{2})*$'
      description: Even-length lowercase native bytes; raw serialized objects are nonempty.
    Cursor:
      type: string
      maxLength: 106
      pattern: '^(0|[1-9][0-9]{0,19})\.[0-9a-f]{64}\.(0|[1-9][0-9]{0,19})$'
    Meta:
      type: object
      additionalProperties: false
      required: [network, chain_height]
      properties:
        network: { type: string, enum: [mainnet, testnet, stagenet] }
        chain_height: { $ref: '#/components/schemas/UInt64' }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, not_found, method_not_allowed, chain_changed, unavailable]
            message: { type: string, minLength: 1, maxLength: 160 }
    BlockSummary:
      type: object
      additionalProperties: false
      required: [height, hash, previous_hash, timestamp_unix, size_bytes, major_version, minor_version, nonce, transaction_count, coinbase_hash]
      properties:
        height: { $ref: '#/components/schemas/UInt64' }
        hash: { $ref: '#/components/schemas/Hash' }
        previous_hash: { $ref: '#/components/schemas/Hash' }
        timestamp_unix: { $ref: '#/components/schemas/UInt64' }
        size_bytes:
          $ref: '#/components/schemas/UInt64'
          description: Native DB block size, including transaction blobs; not just raw block blob length.
        major_version: { type: integer, minimum: 0, maximum: 255 }
        minor_version: { type: integer, minimum: 0, maximum: 255 }
        nonce: { type: integer, minimum: 0, maximum: 4294967295 }
        transaction_count:
          type: integer
          minimum: 1
          description: Includes the coinbase transaction.
        coinbase_hash: { $ref: '#/components/schemas/Hash' }
    TransactionSummary:
      type: object
      allOf:
        - { $ref: '#/components/schemas/TransactionSummaryFields' }
      unevaluatedProperties: false
    Inclusion:
      type: object
      additionalProperties: false
      required: [state, block_height, timestamp_unix, confirmations]
      properties:
        state: { type: string, enum: [confirmed, mempool] }
        block_height: { $ref: '#/components/schemas/NullableUInt64' }
        timestamp_unix: { $ref: '#/components/schemas/NullableUInt64' }
        confirmations: { $ref: '#/components/schemas/UInt64' }
      allOf:
        - if:
            properties: { state: { const: mempool } }
          then:
            properties:
              block_height: { type: 'null' }
              timestamp_unix: { type: 'null' }
              confirmations: { const: '0' }
          else:
            properties:
              block_height: { $ref: '#/components/schemas/UInt64' }
              timestamp_unix: { $ref: '#/components/schemas/UInt64' }
              confirmations:
                $ref: '#/components/schemas/UInt64'
                not: { const: '0' }
    Output:
      type: object
      additionalProperties: false
      required: [index, public_key, amount_atomic]
      properties:
        index: { type: integer, minimum: 0 }
        public_key: { $ref: '#/components/schemas/Hash' }
        amount_atomic:
          $ref: '#/components/schemas/NullableUInt64'
          description: Null when hidden by RingCT; zero is reserved for a publicly known zero.
    RingCandidate:
      type: object
      additionalProperties: false
      required: [public_key, block_height, timestamp_unix]
      properties:
        public_key: { $ref: '#/components/schemas/Hash' }
        block_height: { $ref: '#/components/schemas/UInt64' }
        timestamp_unix: { $ref: '#/components/schemas/UInt64' }
    Input:
      type: object
      additionalProperties: false
      required: [key_image, key_offsets_relative, ring_candidates]
      properties:
        key_image: { $ref: '#/components/schemas/Hash' }
        key_offsets_relative:
          type: array
          items: { $ref: '#/components/schemas/UInt64' }
        ring_candidates:
          type: array
          description: Alternatives, never an identification of the real spend; empty means unavailable.
          items: { $ref: '#/components/schemas/RingCandidate' }
    Transaction:
      type: object
      allOf:
        - { $ref: '#/components/schemas/TransactionSummaryFields' }
        - if:
            properties: { coinbase: { const: true } }
          then:
            properties:
              coinbase_height: { $ref: '#/components/schemas/UInt64' }
              input_count: { const: 0 }
              inputs: { maxItems: 0 }
          else:
            properties:
              coinbase_height: { type: 'null' }
        - if:
            properties:
              coinbase: { const: false }
              ringct_type: { not: { const: 0 } }
          then:
            properties:
              outputs:
                items:
                  properties:
                    amount_atomic: { type: 'null' }
      unevaluatedProperties: false
      required: [inclusion, unlock_time, public_key, additional_public_keys, payment_id, payment_id8, extra_hex, coinbase_height, inputs, outputs]
      properties:
        inclusion: { $ref: '#/components/schemas/Inclusion' }
        unlock_time:
          $ref: '#/components/schemas/UInt64'
          description: Native Ryo unlock field; may represent height or Unix time, not an assumed block height.
        public_key: { $ref: '#/components/schemas/NullableHash' }
        additional_public_keys:
          type: array
          items: { $ref: '#/components/schemas/Hash' }
        payment_id: { $ref: '#/components/schemas/NullableHash' }
        payment_id8:
          anyOf:
            - { type: string, pattern: '^[0-9a-f]{16}$' }
            - { type: 'null' }
          description: Encrypted short payment ID bytes, not decrypted recipient information.
        extra_hex: { $ref: '#/components/schemas/Hex' }
        coinbase_height: { $ref: '#/components/schemas/NullableUInt64' }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/Input' }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/Output' }
    TransactionSummaryFields:
      description: Summary fields shared with detail; closed at the enclosing detail schema.
      type: object
      required: [hash, version, ringct_type, coinbase, size_bytes, fee_atomic, input_count, output_count]
      properties:
        hash: { $ref: '#/components/schemas/Hash' }
        version: { type: integer, minimum: 0, maximum: 255 }
        ringct_type: { type: integer, minimum: 0, maximum: 255 }
        coinbase: { type: boolean }
        size_bytes: { $ref: '#/components/schemas/UInt64' }
        fee_atomic: { $ref: '#/components/schemas/UInt64' }
        input_count:
          type: integer
          minimum: 0
          description: Number of spend inputs; excludes coinbase generation input.
        output_count: { type: integer, minimum: 0 }
    NetworkResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data:
          type: object
          additionalProperties: false
          required: [source, tip, tip_difficulty, target_block_time_seconds, units, explorer_version, native_core_version, api_version]
          properties:
            source: { const: native_lmdb }
            tip: { $ref: '#/components/schemas/BlockSummary' }
            tip_difficulty: { $ref: '#/components/schemas/UInt64' }
            target_block_time_seconds: { type: integer, minimum: 1 }
            units:
              type: object
              additionalProperties: false
              required: [symbol, atomic_decimals, atomic_units_per_coin]
              properties:
                symbol: { const: RYO }
                atomic_decimals: { const: 9 }
                atomic_units_per_coin: { const: '1000000000' }
            explorer_version: { type: string, minLength: 1 }
            native_core_version: { type: string, minLength: 1 }
            api_version: { const: '2' }
    BlockPageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data:
          type: object
          additionalProperties: false
          required: [items, anchor_height, anchor_hash, next_cursor]
          properties:
            items:
              type: array
              minItems: 1
              maxItems: 20
              items: { $ref: '#/components/schemas/BlockSummary' }
            anchor_height: { $ref: '#/components/schemas/UInt64' }
            anchor_hash: { $ref: '#/components/schemas/Hash' }
            next_cursor:
              anyOf:
                - { $ref: '#/components/schemas/Cursor' }
                - { type: 'null' }
    BlockResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data:
          type: object
          additionalProperties: false
          required: [header, transactions]
          properties:
            header: { $ref: '#/components/schemas/BlockSummary' }
            transactions:
              type: array
              minItems: 1
              description: Coinbase first, then native block transaction order.
              items: { $ref: '#/components/schemas/TransactionSummary' }
    TransactionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: { $ref: '#/components/schemas/Transaction' }
    RawResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data:
          type: object
          additionalProperties: false
          required: [hash, native_json, blob_hex]
          properties:
            hash: { $ref: '#/components/schemas/Hash' }
            native_json:
              type: object
              description: Native Ryo JSON with original number/field conventions, not normalized DTOs.
              additionalProperties: true
            blob_hex:
              $ref: '#/components/schemas/Hex'
              minLength: 2
              description: Native serialized bytes; not a JSON-to-binary reconstruction.
